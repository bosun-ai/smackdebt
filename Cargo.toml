[workspace]
resolver = "3"
members = [
    "crates/analysis",
    "crates/languages",
    "crates/discovery",
    "crates/git",
    "crates/project",
    "crates/output",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"

[workspace.dependencies]
anstyle = "1.0"
assert_cmd = "2.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
jsonschema = { version = "0.33", default-features = false }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "0.4"
tempfile = "3.14"
thiserror = "2.0"
terminal_size = "0.4"
toml = "0.8"
stats_alloc = "0.1"
tree-sitter = "0.25"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.23.1"
tree-sitter-python = "0.23.6"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-vue-next = "0.1.0"
unicode-width = "0.2"
