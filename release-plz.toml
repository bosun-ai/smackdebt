[workspace]
git_only = false
publish = true
git_tag_enable = false
git_tag_name = "v{{ version }}"
git_release_enable = false
changelog_update = false
semver_check = false
dependencies_update = false
release_always = false
features_always_increment_minor = true

[changelog]
body = """
## [{{ version }}]{% if release_link %}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}

Install Smackdebt:

```sh
curl -fsSL https://github.com/bosun-ai/smackdebt/releases/download/v{{ version }}/install.sh | sh
```

Or use `brew install bosun-ai/tap/smackdebt` or `cargo binstall smackdebt`.

Then run `smackdebt init` to install or update skills for your agents.
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}{% if commit.links %} ({% for link in commit.links %}[{{ link.text }}]({{ link.href }}) {% endfor %}){% endif %}
{% endfor %}
{% endfor %}
"""

[[package]]
name = "smackdebt"
git_tag_enable = true
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = [
    "smackdebt-analysis",
    "smackdebt-languages",
    "smackdebt-discovery",
    "smackdebt-git",
    "smackdebt-project",
    "smackdebt-output",
]
