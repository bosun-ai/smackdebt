[package]
name = "smackdebt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Find costly code debt and see whether your changes make it better"
homepage = "https://github.com/bosun-ai/smackdebt"
readme = "../../README.md"

[features]
allocation-stats = ["dep:stats_alloc", "smackdebt-project/evidence-stats"]
evidence-stats = ["smackdebt-project/evidence-stats"]
width-test-checks = ["smackdebt-output/width-test-checks"]

[[bin]]
name = "smackdebt"
path = "src/main.rs"

[dependencies]
blake3.workspace = true
same-file = "1.0"
tempfile.workspace = true
clap.workspace = true
serde.workspace = true
stats_alloc = { workspace = true, optional = true }
smackdebt-output = { path = "../output", version = "0.2.0" }
smackdebt-project = { path = "../project", version = "0.2.0" }
terminal_size.workspace = true
toml.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
jsonschema.workspace = true
predicates = "3.1"
serde_json.workspace = true
unicode-width.workspace = true

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"
disabled-strategies = ["quick-install", "compile"]
