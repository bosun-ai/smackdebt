[package]
name = "smackdebt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Find costly code debt and see whether your changes make it better"
readme = "../../README.md"

[features]
allocation-stats = ["dep:stats_alloc", "smackdebt-project/evidence-stats"]
evidence-stats = ["smackdebt-project/evidence-stats"]
width-test-checks = ["smackdebt-output/width-test-checks"]

[[bin]]
name = "smackdebt"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
stats_alloc = { workspace = true, optional = true }
smackdebt-output = { path = "../output", version = "0.1.0" }
smackdebt-project = { path = "../project", version = "0.1.0" }
terminal_size.workspace = true
toml.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
jsonschema.workspace = true
predicates = "3.1"
serde_json.workspace = true
tempfile.workspace = true
unicode-width.workspace = true

[lints]
workspace = true
